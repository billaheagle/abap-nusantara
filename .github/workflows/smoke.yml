# Smoke-tests the live site after every production deploy on Vercel.
#
# Vercel reports each deploy back to GitHub as a deployment; when one to
# Production succeeds, this runs e2e/smoke.spec.ts against the real domain
# (read-only: nothing is posted or liked). A failure opens an issue, which
# emails the repo owner: a failed run started by Vercel's bot wouldn't.
# It can also be started by hand from the Actions tab.
name: Smoke test production

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: smoke-production
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMOKE_BASE_URL: https://www.abapnusantara.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Give the domain a moment to point at the new deployment.
      - run: sleep 20

      - run: npm run test:smoke

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - uses: actions/github-script@v7
        if: failure()
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = (context.payload.deployment?.sha ?? context.sha).slice(0, 7);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Smoke test gagal di production (${sha})`,
              body: `Smoke test setelah deploy \`${sha}\` gagal.\n\nLog dan laporan Playwright: ${run}\n\nSitus: https://www.abapnusantara.com`,
            });
